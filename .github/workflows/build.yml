name: Build Mods
on: [push, pull_request]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Execute Gradle build
        run: ./gradlew build
      - name: Archive Renode builds
        uses: actions/upload-artifact@v7
        with:
          name: Renode
          path: renode/build/libs/*.jar
      - name: Archive Carta builds
        uses: actions/upload-artifact@v7
        with:
          name: Carta
          path: carta/build/libs/*.jar
      - name: Archive Extra Asset Roots builds
        uses: actions/upload-artifact@v7
        with:
          name: Extra Asset Roots
          path: extra_asset_roots/build/libs/*.jar