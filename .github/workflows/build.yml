name: Build Mods
on: [push, pull_request]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Execute Gradle build
        run: gradle build
      - name: Archive mod builds
        uses: actions/upload-artifact@v7
        with:
          name: mods
          path: |
            renode/build/libs/*.jar
            carta/build/libs/*.jar
            extra_asset_roots/build/libs/*.jar